# Builds ready-to-run VLC packages with Gemma 4 live translation baked in:
# the binaries, the llama.cpp/espeak-ng runtimes and the Gemma model weights
# are all bundled, so the user only unpacks the archive and starts vlc.
# Archives are split into parts below the 2 GiB GitHub release asset limit.
#
# Triggered by version tags (v*) or manually (workflow_dispatch publishes a
# prerelease named dev-<run number>).

name: release

on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'modules/audio_filter/transcribe/**'
  workflow_dispatch:

env:
  LLAMA_TAG: b9957
  MODEL_URL: https://huggingface.co/unsloth/gemma-4-E2B-it-GGUF/resolve/main/gemma-4-E2B-it-Q4_K_M.gguf
  MMPROJ_URL: https://huggingface.co/unsloth/gemma-4-E2B-it-GGUF/resolve/main/mmproj-F16.gguf
  SPLIT_SIZE: 1900M

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          # Pull the full build-dependency set of the distro VLC package,
          # which covers most of what a desktop VLC build needs
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get build-dep -y vlc
          # Qt 6 developer tools (qsb, qmlcachegen, lupdate) live outside PATH
          echo "/usr/lib/qt6/bin" >> "$GITHUB_PATH"
          echo "/usr/lib/qt6/libexec" >> "$GITHUB_PATH"
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool pkg-config flex bison \
            gettext autopoint cmake ninja-build git ca-certificates curl \
            zstd p7zip-full liblua5.2-dev lua5.2 wget aria2 \
            qt6-base-dev qt6-base-private-dev qt6-declarative-dev \
            qt6-declarative-private-dev qt6-declarative-dev-tools \
            qt6-shader-baker qt6-l10n-tools qt6-svg-dev qt6-wayland \
            qml6-module-* \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libasound2-dev libpulse-dev libx11-dev libxcb1-dev \
            libxcb-shm0-dev libxcb-composite0-dev libxcb-xkb-dev \
            libxcb-randr0-dev libxcb-render0-dev libxcb-render-util0-dev \
            libxcb-keysyms1-dev libxcb-cursor-dev libxcb-xfixes0-dev \
            libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libfreetype-dev libfontconfig-dev libfribidi-dev libharfbuzz-dev \
            libgl-dev libegl-dev libgles-dev libdrm-dev \
            libmpg123-dev libmad0-dev libvorbis-dev libogg-dev libopus-dev \
            libflac-dev libmatroska-dev libebml-dev libdvbpsi-dev \
            liba52-0.7.4-dev libgcrypt20-dev libgnutls28-dev \
            libarchive-dev libxml2-dev libsecret-1-dev \
            libespeak-ng-dev espeak-ng-data libespeak-ng1

      - name: Build llama.cpp (libllama + libmtmd, Vulkan GPU)
        run: |
          # Vulkan build tools: dev headers/loader for linking and glslc to
          # compile the compute shaders. The Vulkan loader (libvulkan1) is
          # bundled with the package later, so the GPU backend loads even on
          # machines that do not ship one; when there is no GPU driver the
          # loader simply reports no device and processing stays on the CPU.
          # ggml-vulkan also needs the SPIRV-Headers/Tools CMake config
          # packages (not pulled in by libvulkan-dev) to build its shader
          # generator.
          sudo apt-get install -y libvulkan-dev libvulkan1 glslc glslang-tools \
            spirv-headers spirv-tools \
            || sudo apt-get install -y libvulkan-dev libvulkan1 glslang-tools \
               spirv-headers spirv-tools
          git clone --depth 1 --branch "$LLAMA_TAG" \
            https://github.com/ggml-org/llama.cpp.git llama.cpp

          build() {
            rm -rf llama.cpp/build
            cmake -S llama.cpp -B llama.cpp/build -G Ninja \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=ON \
              -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
              -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_APP=OFF \
              -DLLAMA_CURL=OFF -DGGML_NATIVE=OFF "$@" \
              -DCMAKE_INSTALL_PREFIX=/usr/local || return 1
            ninja -C llama.cpp/build || return 1
          }

          if build -DGGML_VULKAN=ON; then
            echo "llama.cpp built with Vulkan GPU support"
          else
            echo "Vulkan build failed, falling back to CPU-only llama.cpp"
            build
          fi
          sudo ninja -C llama.cpp/build install
          sudo ldconfig

      - name: Build VLC
        run: |
          ./bootstrap
          mkdir build && cd build
          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig ../configure \
            --prefix=/opt/vlc-gemma --disable-nls \
            --enable-qt --enable-avcodec --enable-alsa --enable-pulse \
            --enable-espeak-ng --enable-llamacpp
          make -j"$(nproc)"
          sudo make install

      - name: Assemble portable bundle
        run: |
          B=bundle/vlc-gemma
          mkdir -p "$B"
          cp -a /opt/vlc-gemma/* "$B/"

          # Bundle every non-glibc shared library dependency
          mkdir -p "$B/lib"
          collect() {
            ldd "$1" 2>/dev/null | awk '/=> \//{print $3}'
          }
          { collect "$B/bin/vlc"
            find "$B/lib/vlc" -name '*.so' | while read -r so; do collect "$so"; done
          } | sort -u | grep -vE '/lib(c|m|dl|rt|pthread|resolv|nsl)\.so|ld-linux' \
            | while read -r lib; do cp -Ln "$lib" "$B/lib/" || true; done

          # Explicitly bundle the llama.cpp / ggml runtime and the Vulkan GPU
          # backend + loader. ggml may load a backend that is not a direct
          # NEEDED of the plugin, and the Vulkan loader lets the GPU backend
          # initialise (or cleanly report no device and fall back to CPU) on
          # machines that do not ship libvulkan.
          for lib in /usr/local/lib/libggml*.so* /usr/local/lib/libllama*.so* \
                     /usr/local/lib/libmtmd*.so* \
                     /usr/lib/x86_64-linux-gnu/libvulkan.so*; do
            [ -e "$lib" ] && cp -Ln "$lib" "$B/lib/" || true
          done

          # Qt runtime (plugins + QML modules)
          QTDIR=/usr/lib/x86_64-linux-gnu/qt6
          mkdir -p "$B/qt6"
          cp -a "$QTDIR/plugins" "$B/qt6/plugins"
          cp -a "$QTDIR/qml" "$B/qt6/qml"

          # espeak-ng voice data
          cp -a /usr/lib/x86_64-linux-gnu/espeak-ng-data "$B/share/vlc/espeak-ng-data"

          # Gemma model weights (baked into the package; small
          # placeholders on pull-request debug runs)
          mkdir -p "$B/share/vlc/gemma"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            head -c 8388608 /dev/zero > "$B/share/vlc/gemma/$(basename "$MODEL_URL")"
            head -c 1048576 /dev/zero > "$B/share/vlc/gemma/$(basename "$MMPROJ_URL")"
          else
          fetch() {
            aria2c -c -x 8 -s 8 --max-tries=10 --retry-wait=15 \
              --file-allocation=none --console-log-level=warn \
              --summary-interval=60 -d "$(dirname "$2")" \
              -o "$(basename "$2")" "$1"
          }
            fetch "$MODEL_URL" "$B/share/vlc/gemma/$(basename "$MODEL_URL")"
            fetch "$MMPROJ_URL" "$B/share/vlc/gemma/$(basename "$MMPROJ_URL")"
          fi

          # Launcher
          cat > "$B/vlc.sh" << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$HERE/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          export VLC_PLUGIN_PATH="$HERE/lib/vlc/plugins"
          export VLC_LIB_PATH="$HERE/lib/vlc"
          export VLC_DATA_PATH="$HERE/share/vlc"
          export QT_PLUGIN_PATH="$HERE/qt6/plugins"
          export QML_IMPORT_PATH="$HERE/qt6/qml"
          export QML2_IMPORT_PATH="$HERE/qt6/qml"
          exec "$HERE/bin/vlc" "$@"
          EOF
          chmod +x "$B/vlc.sh"

          cat > "$B/README-TRANSLATE.txt" << 'EOF'
          VLC with Gemma 4 live translation (Linux x86_64, Ubuntu 24.04+ ABI)
          ===================================================================
          Everything runs on your computer. No account, no server, no ports
          to open — the Gemma 4 model is bundled in share/vlc/gemma.

          Your GPU is used automatically when a Vulkan-capable one is present
          (much faster, keeps subtitles and voice-over in real time). Without
          a GPU it runs on the CPU — on a slow computer expect the subtitles
          to lag and only cover part of the speech.

          Easiest way (menu):
            1. Start VLC:   ./vlc.sh
            2. Open your video.
            3. Menu  View > Live Translation (Gemma 4).
            4. Pick a language, tick Subtitles and/or Voice-over, keep "Use
               the GPU" ticked, press Translate. The first line appears
               after a few seconds.

          Command line, if you prefer:
            ./vlc.sh --audio-filter=gemma_transcribe --sub-source=transcript \
                     --gemma-transcribe-language=Russian \
                     --gemma-transcribe-voiceover video.mkv

          Translate another app's sound (a browser, a call...):
            ./vlc.sh "pulse://$(pactl get-default-sink).monitor" \
                     --audio-filter=gemma_transcribe \
                     --gemma-transcribe-listen --gemma-transcribe-voiceover \
                     --gemma-transcribe-language=Russian

          The "Inference server" fields in the advanced preferences are only
          for people who want to point VLC at their own AI server; you do not
          need them.
          EOF

      - name: Smoke test the bundle
        run: |
          bundle/vlc-gemma/vlc.sh --version
          bundle/vlc-gemma/vlc.sh -I dummy --list | grep -E "gemma_transcribe|transcript"

      - name: Archive and split
        run: |
          cd bundle
          tar -I 'zstd -T0 -8' -cf vlc-gemma-linux-x86_64.tar.zst vlc-gemma
          split -b "$SPLIT_SIZE" -d vlc-gemma-linux-x86_64.tar.zst \
                vlc-gemma-linux-x86_64.tar.zst.part
          rm vlc-gemma-linux-x86_64.tar.zst
          sha256sum vlc-gemma-linux-x86_64.tar.zst.part* > SHA256SUMS-linux.txt
          cat >> SHA256SUMS-linux.txt << 'EOF'
          # Join the parts before unpacking:
          #   cat vlc-gemma-linux-x86_64.tar.zst.part* > vlc-gemma-linux-x86_64.tar.zst
          #   tar --zstd -xf vlc-gemma-linux-x86_64.tar.zst
          EOF

      - uses: actions/upload-artifact@v6
        with:
          name: linux-x86_64
          path: |
            bundle/vlc-gemma-linux-x86_64.tar.zst.part*
            bundle/SHA256SUMS-linux.txt
          compression-level: 0

  windows:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    container:
      image: registry.videolan.org/vlc-debian-win64-posix:20260611225331
      options: --user root
    env:
      TRIPLET: x86_64-w64-mingw32
    steps:
      - uses: actions/checkout@v6

      - name: Build llama.cpp for Windows (Vulkan GPU, CPU fallback)
        run: |
          git config --global --add safe.directory '*'
          git clone --depth 1 --branch "$LLAMA_TAG" \
            https://github.com/ggml-org/llama.cpp.git llama.cpp
          PREFIX="$PWD/contrib/$TRIPLET"
          PC="$PREFIX/lib/pkgconfig/llama.pc"

          # VLC links Windows plugins statically, so build static libraries.
          # The static link needs the whole dependency closure, with mtmd in
          # front of the libraries it depends on.
          build_cpu() {
            rm -rf llama.cpp/build
            cmake -S llama.cpp -B llama.cpp/build \
              -DCMAKE_SYSTEM_NAME=Windows \
              -DCMAKE_C_COMPILER=$TRIPLET-gcc \
              -DCMAKE_CXX_COMPILER=$TRIPLET-g++ \
              -DCMAKE_RC_COMPILER=$TRIPLET-windres \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
              -DGGML_OPENMP=OFF \
              -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
              -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_APP=OFF \
              -DLLAMA_CURL=OFF -DGGML_NATIVE=OFF \
              -DCMAKE_INSTALL_PREFIX="$PREFIX" || return 1
            cmake --build llama.cpp/build -j"$(nproc)" || return 1
            cmake --install llama.cpp/build || return 1
            sed -i 's|^Libs:.*|Libs: -L${libdir} -lmtmd -lllama -lggml -lggml-cpu -lggml-base -lstdc++ -lwinpthread|' "$PC"
          }

          # Cross-build the Khronos Vulkan headers + loader (Apache-2.0, so
          # the resulting vulkan-1.dll ships in the package) and llama.cpp
          # with the Vulkan backend. glslc (host) compiles the shaders.
          VK_TAG=vulkan-sdk-1.3.290.0
          build_vulkan() {
            # glslc + SPIRV headers/tools for ggml's host shader generator
            apt-get update && apt-get install -y glslc spirv-headers spirv-tools \
              || return 1
            git clone --depth 1 --branch "$VK_TAG" \
              https://github.com/KhronosGroup/Vulkan-Headers.git vk-headers || return 1
            # The headers repo ships an optional C++20 module target that the
            # Unix Makefiles generator cannot configure; we only need the
            # installed headers, so disable it.
            cmake -S vk-headers -B vk-headers/build \
              -DVULKAN_HEADERS_ENABLE_MODULE=OFF \
              -DCMAKE_CXX_SCAN_FOR_MODULES=OFF \
              -DCMAKE_INSTALL_PREFIX="$PREFIX" || return 1
            cmake --install vk-headers/build || return 1
            git clone --depth 1 --branch "$VK_TAG" \
              https://github.com/KhronosGroup/Vulkan-Loader.git vk-loader || return 1
            cmake -S vk-loader -B vk-loader/build \
              -DCMAKE_SYSTEM_NAME=Windows \
              -DCMAKE_C_COMPILER=$TRIPLET-gcc \
              -DCMAKE_CXX_COMPILER=$TRIPLET-g++ \
              -DCMAKE_RC_COMPILER=$TRIPLET-windres \
              -DCMAKE_BUILD_TYPE=Release -DUSE_MASM=OFF \
              -DBUILD_TESTS=OFF -DENABLE_WERROR=OFF -DUPDATE_DEPS=OFF \
              -DVULKAN_HEADERS_INSTALL_DIR="$PREFIX" \
              -DCMAKE_INSTALL_PREFIX="$PREFIX" || return 1
            cmake --build vk-loader/build -j"$(nproc)" || return 1
            cmake --install vk-loader/build || return 1
            VK_LIB=$(ls "$PREFIX"/lib/libvulkan-1.dll.a "$PREFIX"/lib/vulkan-1.lib \
                        "$PREFIX"/lib/libvulkan.dll.a 2>/dev/null | head -1)
            [ -n "$VK_LIB" ] || return 1
            rm -rf llama.cpp/build
            cmake -S llama.cpp -B llama.cpp/build \
              -DCMAKE_SYSTEM_NAME=Windows \
              -DCMAKE_C_COMPILER=$TRIPLET-gcc \
              -DCMAKE_CXX_COMPILER=$TRIPLET-g++ \
              -DCMAKE_RC_COMPILER=$TRIPLET-windres \
              -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
              -DGGML_OPENMP=OFF -DGGML_VULKAN=ON \
              -DVulkan_INCLUDE_DIR="$PREFIX/include" \
              -DVulkan_LIBRARY="$VK_LIB" \
              -DVulkan_GLSLC_EXECUTABLE="$(command -v glslc)" \
              -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF \
              -DLLAMA_BUILD_SERVER=OFF -DLLAMA_BUILD_APP=OFF \
              -DLLAMA_CURL=OFF -DGGML_NATIVE=OFF \
              -DCMAKE_INSTALL_PREFIX="$PREFIX" || return 1
            cmake --build llama.cpp/build -j"$(nproc)" || return 1
            cmake --install llama.cpp/build || return 1
            sed -i 's|^Libs:.*|Libs: -L${libdir} -lmtmd -lllama -lggml -lggml-vulkan -lggml-cpu -lggml-base -lvulkan-1 -lstdc++ -lwinpthread|' "$PC"
          }

          if build_vulkan; then
            echo "llama.cpp built with Vulkan GPU support"
          else
            echo "Vulkan cross-build unavailable, falling back to CPU-only"
            build_cpu
          fi
          cat "$PC"

      - name: Build espeak-ng for Windows
        run: |
          # Native espeak-ng data files come from the Debian package
          apt-get update && apt-get install -y espeak-ng-data libtool autoconf automake curl ca-certificates
          git clone --depth 1 --branch 1.52.0 \
            https://github.com/espeak-ng/espeak-ng.git espeak-ng
          cd espeak-ng
          ./autogen.sh
          ./configure --host=$TRIPLET --prefix="$GITHUB_WORKSPACE/contrib/$TRIPLET" \
            --without-pcaudiolib --without-klatt --without-speechplayer \
            --without-mbrola --without-sonic --without-async
          # Only the library is cross-compiled; voice data is taken from Debian
          make -C src -j"$(nproc)" libespeak-ng.la || make -j"$(nproc)" || true
          make install || make -C src install-libLTLIBRARIES install-includeHEADERS || true
          ls "$GITHUB_WORKSPACE/contrib/$TRIPLET/lib/pkgconfig/" || true

      - name: Build VLC for Windows (prebuilt contribs)
        run: |
          extras/package/win32/build.sh -a x86_64 -p -o "$PWD/win-install"

      - name: Assemble portable package
        run: |
          B=pkg/vlc-gemma
          mkdir -p pkg
          # package-win-common produced an installed tree in win-install
          cp -a win-install "$B" 2>/dev/null || {
            # fall back to the vlc-<version> dir produced by package targets
            D=$(find win64 -maxdepth 1 -type d -name 'vlc-*' | head -1)
            cp -a "$D" "$B"
          }
          # llama.cpp / espeak runtime DLLs
          cp contrib/$TRIPLET/bin/*.dll "$B/" 2>/dev/null || true
          find contrib/$TRIPLET -name 'libllama*.dll' -o -name 'libmtmd*.dll' \
               -o -name 'libggml*.dll' -o -name 'libespeak-ng*.dll' | \
               while read -r dll; do cp -n "$dll" "$B/"; done
          # espeak voice data next to the data dir used by the plugin
          cp -a /usr/lib/*/espeak-ng-data "$B/espeak-ng-data" 2>/dev/null || \
            cp -a /usr/share/espeak-ng-data "$B/espeak-ng-data"
          # Gemma model weights (baked into the package; small
          # placeholders on pull-request debug runs)
          mkdir -p "$B/gemma"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            head -c 8388608 /dev/zero > "$B/gemma/$(basename "$MODEL_URL")"
            head -c 1048576 /dev/zero > "$B/gemma/$(basename "$MMPROJ_URL")"
          else
            apt-get install -y aria2 || (apt-get update && apt-get install -y aria2)
          fetch() {
            aria2c -c -x 8 -s 8 --max-tries=10 --retry-wait=15 \
              --file-allocation=none --console-log-level=warn \
              --summary-interval=60 -d "$(dirname "$2")" \
              -o "$(basename "$2")" "$1"
          }
            fetch "$MODEL_URL" "$B/gemma/$(basename "$MODEL_URL")"
            fetch "$MMPROJ_URL" "$B/gemma/$(basename "$MMPROJ_URL")"
          fi
          cat > "$B/README-TRANSLATE.txt" << 'EOF'
          VLC with Gemma 4 live translation (Windows x86_64)
          ==================================================
          Everything runs on your computer. No account, no server, no ports
          to open — the Gemma 4 model is bundled in the gemma\ folder.

          Your GPU is used automatically when a Vulkan-capable one is present
          (much faster, keeps subtitles and voice-over in real time). Without
          a GPU it runs on the CPU — on a slow computer expect the subtitles
          to lag and only cover part of the speech.

          1. Run vlc.exe and open your video.
          2. Menu  View > Live Translation (Gemma 4).
          3. Pick a language, tick Subtitles and/or Voice-over, keep "Use the
             GPU" ticked, press Translate. The first line appears after a few
             seconds.

          The "Inference server" fields in the advanced preferences are only
          for people who want to point VLC at their own AI server; you do not
          need them.
          EOF

      - name: Archive and split (7z volumes)
        run: |
          apt-get install -y p7zip-full curl || (apt-get update && apt-get install -y p7zip-full curl)
          cd pkg
          7z a -mx=5 -v$SPLIT_SIZE vlc-gemma-win64.7z vlc-gemma
          sha256sum vlc-gemma-win64.7z.* > SHA256SUMS-win64.txt
          echo "# Open vlc-gemma-win64.7z.001 with 7-Zip: the parts join automatically." >> SHA256SUMS-win64.txt

      - uses: actions/upload-artifact@v6
        with:
          name: win64
          path: |
            pkg/vlc-gemma-win64.7z.*
            pkg/SHA256SUMS-win64.txt
          compression-level: 0

  release:
    # Publish whatever platforms succeeded, so a broken platform does not
    # hold back the others
    if: ${{ github.event_name != 'pull_request' && !cancelled() &&
            (needs.linux.result == 'success' || needs.windows.result == 'success') }}
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            PRERELEASE=""
          else
            TAG="dev-${{ github.run_number }}"
            PRERELEASE="--prerelease"
          fi
          cat > notes.md << 'EOF'
          VLC with Gemma 4 live speech translation — ready to run, model
          weights included. Uses a Vulkan-capable GPU automatically for
          real-time subtitles and voice-over, and falls back to the CPU.

          **Linux**: join the parts, unpack, run `./vlc-gemma/vlc.sh`
          ```
          cat vlc-gemma-linux-x86_64.tar.zst.part* > vlc-gemma-linux-x86_64.tar.zst
          tar --zstd -xf vlc-gemma-linux-x86_64.tar.zst
          ```
          **Windows**: open `vlc-gemma-win64.7z.001` with 7-Zip (parts join
          automatically), unpack and run `vlc.exe`.

          See README-TRANSLATE.txt inside the archives for usage examples.
          EOF
          gh release create "$TAG" $PRERELEASE --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md \
            $(find assets -type f | sort)
